 <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Щявель Messenger</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#17212b;color:white;
 font-family:Arial,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer;border:0}
.screen{
 min-height:100vh;display:flex;
 align-items:center;justify-content:center;padding:20px;
}
.auth{
 width:100%;max-width:380px;text-align:center;
 background:#202d3a;padding:30px;border-radius:18px;
}
.logo{
 width:75px;height:75px;border-radius:50%;
 background:#229ed9;display:grid;place-items:center;
 margin:0 auto 18px;font-size:35px;font-weight:bold;
}
h1{margin:8px 0}
.muted{color:#91a4b5;font-size:14px}
input{
 width:100%;padding:14px;margin:10px 0;
 border:1px solid #405263;border-radius:10px;
 background:#17212b;color:white;outline:none;
}
.primary{
 width:100%;padding:14px;background:#229ed9;
 color:white;border-radius:10px;font-weight:bold;
 margin-top:10px;
}
.hidden{display:none!important}
#messenger{
 display:flex;height:100vh;max-width:1200px;
 margin:auto;background:#17212b;
}
.sidebar{
 width:340px;border-right:1px solid #30404e;
 display:flex;flex-direction:column;
}
.header{padding:18px;background:#202d3a}
.brand{font-size:23px;font-weight:bold;color:#42b8f5}
.chat{
 padding:17px;display:flex;gap:12px;
 align-items:center;cursor:pointer;
 border-bottom:1px solid #253442;
}
.chat:hover,.chat.active{background:#263747}
.avatar{
 width:45px;height:45px;border-radius:50%;
 background:#229ed9;display:grid;
 place-items:center;font-weight:bold;
}
.chatinfo{flex:1}
.chatinfo small{color:#91a4b5}
.conversation{
 flex:1;display:flex;flex-direction:column;
 min-width:0;
}
.chatheader{
 padding:16px;background:#202d3a;
 border-bottom:1px solid #30404e;
}
.messages{
 flex:1;overflow-y:auto;padding:20px;
 display:flex;flex-direction:column;gap:12px;
}
.bubble{
 max-width:75%;padding:12px 15px;
 background:#263747;border-radius:14px;
 align-self:flex-start;overflow-wrap:anywhere;
}
.bubble.mine{
 background:#176b91;align-self:flex-end;
}
.send{
 display:flex;gap:10px;padding:14px;
 background:#202d3a;
}
.send input{margin:0}
.send button{
 background:#229ed9;color:white;
 padding:0 18px;border-radius:10px;
}
.empty{
 margin:auto;text-align:center;color:#91a4b5;
}
@media(max-width:650px){
 #messenger{height:100dvh}
 .sidebar{width:100%}
 .conversation{width:100%}
 .sidebar.hide{display:none}
 .conversation.hide{display:none}
}
</style>
</head>

<body>

<!-- Регистрация -->
<div class="screen" id="auth">
 <div class="auth">
  <div class="logo">Щ</div>
  <h1>ЩЯВЕЛЬ</h1>
  <p class="muted">Твой новый мессенджер</p>

  <div id="register">
   <input id="phone" type="tel"
    placeholder="+7XXXXXXXXXX">

   <button class="primary" id="sendCodeBtn">
    Получить код
   </button>

   <div id="codeBlock" class="hidden">
    <input id="smsCode" type="text"
     placeholder="Код из SMS">
    <button class="primary" id="verifyCodeBtn">
     Подтвердить
    </button>
   </div>

   <p id="authStatus" class="muted"></p>
   <div id="recaptcha-container"></div>
  </div>
 </div>
</div>

<!-- Мессенджер -->
<div id="messenger" class="hidden">

 <aside class="sidebar" id="sidebar">

  <div class="header">
   <div class="brand">ЩЯВЕЛЬ</div>
   <p class="muted" id="myname"></p>
  </div>

  <div class="chat active"
   onclick="openChat('Общий чат')">
   <div class="avatar">Щ</div>
   <div class="chatinfo">
    <b>Общий чат</b><br>
    <small>Добро пожаловать!</small>
   </div>
  </div>

  <div class="chat"
   onclick="openChat('Заметки')">
   <div class="avatar">З</div>
   <div class="chatinfo">
    <b>Заметки</b><br>
    <small>Личные сообщения</small>
   </div>
  </div>

  <div style="margin-top:auto;padding:18px" class="muted">
   Щявель Messenger
   <button class="primary" id="logoutBtn">Выйти</button>
  </div>

 </aside>

 <main class="conversation" id="conversation">

  <div class="chatheader">
   <b id="chatname">Общий чат</b>
   <div class="muted">Демонстрационный режим</div>
  </div>
 <div class="messages" id="messages">
   <div class="empty">
    <h2>Добро пожаловать в Щявель!</h2>
    <p>Напиши своё первое сообщение.</p>
   </div>
  </div>

  <form class="send" id="messageForm">
   <input id="message"
    placeholder="Написать сообщение..."
    autocomplete="off">
   <button type="submit">➤</button>
  </form>

 </main>
</div>

<script type="module">

import { initializeApp }
 from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
 getAuth,
 RecaptchaVerifier,
 signInWithPhoneNumber,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


const firebaseConfig = {
 apiKey: "AIzaSyDv7hfQKtOfjoZu9-09ZBJme1dSe5Nqgrc",
 authDomain: "shyavel-messenger.firebaseapp.com",
 projectId: "shyavel-messenger",
 storageBucket: "shyavel-messenger.firebasestorage.app",
 messagingSenderId: "150291546592",
 appId: "1:150291546592:web:c5a1159e46d6ee255dab85",
 measurementId: "G-PB1WEJYZGC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let confirmationResult = null;
let recaptchaVerifier = null;

let currentChat = "Общий чат";

let chats = JSON.parse(
 localStorage.getItem("shyavel_chats") || "{}"
);

const status = document.getElementById("authStatus");


// Создание проверки reCAPTCHA
function createRecaptcha(){
 if(recaptchaVerifier){
  recaptchaVerifier.clear();
 }

 recaptchaVerifier = new RecaptchaVerifier(
  auth,
  "recaptcha-container",
  {size:"normal"}
 );
}


// Отправка SMS
async function sendCode(){

 const phone = document
  .getElementById("phone")
  .value.trim();

 if(!phone.startsWith("+") || phone.length < 8){
  status.textContent =
   "Введи номер в международном формате, например +7...";
  return;
 }

 try{

  status.textContent = "Подготовка отправки кода...";

  createRecaptcha();

  const captcha = await recaptchaVerifier.render();

  await recaptchaVerifier.verify();

  confirmationResult = await signInWithPhoneNumber(
   auth,
   phone,
   recaptchaVerifier
  );

  document.getElementById("codeBlock")
   .classList.remove("hidden");

  status.textContent = "Код отправлен. Проверь SMS.";

 }catch(error){

  console.error(error);

  status.textContent =
   "Ошибка: " + error.message;

  if(recaptchaVerifier){
   recaptchaVerifier.clear();
   recaptchaVerifier = null;
  }

 }
}


// Проверка SMS-кода
async function verifyCode(){

 const code = document
  .getElementById("smsCode")
  .value.trim();

 if(!confirmationResult){
  status.textContent = "Сначала запроси код.";
  return;
 }

 if(!code){
  status.textContent = "Введи код из SMS.";
  return;
 }

 try{

  status.textContent = "Проверяем код...";

  await confirmationResult.confirm(code);

 }catch(error){

  console.error(error);

  status.textContent =
   "Ошибка проверки: " + error.message;

 }

}


// Состояние авторизации
onAuthStateChanged(auth, user => {

 if(user){

  document.getElementById("auth")
   .classList.add("hidden");

  document.getElementById("messenger")
   .classList.remove("hidden");

  document.getElementById("myname").textContent =
   "Пользователь: " + user.phoneNumber;

  openChat(currentChat);

 }else{

  document.getElementById("messenger")
   .classList.add("hidden");

  document.getElementById("auth")
   .classList.remove("hidden");

 }

});


// Выход
async function logout(){

 try{
  await signOut(auth);
 }catch(error){
  status.textContent = error.message;
 }

}


// Открытие чата
function openChat(name){

 currentChat = name;

 document.getElementById("chatname").textContent = name;

 document.querySelectorAll(".chat")
  .forEach(el => el.classList.remove("active"));

 const list = chats[name] || [];

 const area = document.getElementById("messages");

 area.innerHTML = "";

 if(!list.length){

  area.innerHTML =
   '<div class="empty"><h2>' +
   escapeHTML(name) +
   '</h2><p>Пока сообщений нет</p></div>';

 }else{

  list.forEach(m => {

   const b = document.createElement("div");

   b.className = "bubble" + (m.mine ? " mine" : "");

   b.textContent = m.text;

   area.appendChild(b);

  });

 }
 area.scrollTop = area.scrollHeight;

 if(innerWidth <= 650){

  document.getElementById("sidebar")
   .classList.add("hide");

  document.getElementById("conversation")
   .classList.remove("hide");

 }

}


// Отправка сообщения
function sendMessage(e){

 e.preventDefault();

 const input = document.getElementById("message");

 const value = input.value.trim();

 if(!value)return;

 if(!chats[currentChat]){
  chats[currentChat] = [];
 }

 chats[currentChat].push({
  text:value,
  mine:true
 });

 localStorage.setItem(
  "shyavel_chats",
  JSON.stringify(chats)
 );

 input.value = "";

 openChat(currentChat);

}


// Защита текста
function escapeHTML(s){

 return s.replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));

}


// Кнопки
document.getElementById("sendCodeBtn")
 .addEventListener("click", sendCode);

document.getElementById("verifyCodeBtn")
 .addEventListener("click", verifyCode);

document.getElementById("logoutBtn")
 .addEventListener("click", logout);

document.getElementById("messageForm")
 .addEventListener("submit", sendMessage);


// Доступ к открытию чатов
window.openChat = openChat;

</script>

</body>
</html>
